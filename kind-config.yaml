kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zero-trust-gateway
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 9080
        hostPort: 9080
        protocol: TCP
      - containerPort: 9443
        hostPort: 9443
        protocol: TCP
