apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: zero-trust-security-policy
  namespace: ingress-apisix
spec:
  plugins:
    # 1. DDoS Mitigation & Rate Limiting Plugin
    - name: limit-count
      enable: true
      config:
        count: 10
        time_window: 60
        rejected_code: 429
        rejected_msg: "Too Many Requests: Rate limit exceeded for Zero-Trust API consumer."
        key_type: var
        key: remote_addr # Rate limit per client IP; in prod can also be consumer_name or http_authorization
        policy: local     # Local in-memory counter; switch to 'redis' in multi-node clusters
        show_remaining: true

    # 2. Enterprise CORS Policy
    - name: cors
      enable: true
      config:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
        expose_headers: "X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset"
        max_age: 3600
        allow_credential: true

    # 3. Observability & Prometheus Metrics
    - name: prometheus
      enable: true
